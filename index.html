<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solución a Problemas de Algoritmos</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Solución a Problemas de Algoritmos</h1>

        <!-- Problema 1 -->
        <div class="problem">
            <h3>Problema 1: Calcular Promedio de 7 Calificaciones</h3>
            <div id="inputs-promedio"></div>
            <button onclick="calcularPromedio7()">Calcular Promedio</button>
            <div id="resultado1" class="resultado"></div>
        </div>

        <!-- Problema 2 -->
        <div class="problem">
            <h3>Problema 2: Leer 10 números e imprimir solamente los positivos</h3>
            <div id="inputs-positivos"></div>
            <button onclick="mostrarNumerosPositivos()">Mostrar Positivos</button>
            <div id="resultado2" class="resultado"></div>
        </div>

        <!-- Problema 3 -->
        <div class="problem">
            <h3>Problema 3: Contar positivos, negativos y neutros de 20 números</h3>
            <div id="inputs-tipos"></div>
            <button onclick="contarTipos()">Contar Tipos</button>
            <div id="resultado3" class="resultado"></div>
        </div>

        <!-- Problema 4 -->
        <div class="problem">
            <h3>Problema 4: Registrar Ventas de Tienda</h3>
            <div id="inputs-ventas"></div>
            <button onclick="registrarVentas()">Registrar Ventas</button>
            <div id="resultado4" class="resultado"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
